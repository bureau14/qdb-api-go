agents:
  queue: "{queue}"

retry:
  automatic:
      limit: 3

label: "{name} ({slug})"
key: "build-{slug}"

commands:
  - echo \"+++ Start Services\"
  - bash scripts/tests/setup/start-services.sh
  - echo \"+++ Build\"
  - bash scripts/teamcity/10.build.sh
  - echo \"+++ Test\"
  - bash scripts/teamcity/20.test.sh
  - echo \"+++ Examples\"
  - bash scripts/teamcity/30.examples.sh
  - echo \"+++ Documentation examples\"
  - bash scripts/teamcity/40.documentation-examples.sh

plugins:
  - bureau14/qdb-artifacts#sc-20192/snapshot-dependencies:
      download:
        clean: true
        projects:
        - project_id: "quasardb-build"
          output-dir: "qdb"
          extract: true
          files:
            - "*-c-api.tar.zst!*"
            - "*-server.tar.zst!*"
            - "*-utils.tar.zst!*"
      # sc-20192 test branch only: a made-up snapshot key, so that the job
      # side writes source, downloads and a pointer on every platform
      # without a plan step. Never a real key; run with SNAPSHOT_DISABLE=1.
      upload:
        variant: "{slug}"
        git_ref: "refs/heads/sc-20192/snapshot-dependencies"
        files:
          - "go.mod"
        snapshot: "v1-7e577e577e577e577e577e577e577e57"
      promote:
        variant: "{slug}"
        git_ref: "refs/heads/sc-20192/snapshot-dependencies"
        snapshot: "v1-7e577e577e577e577e577e577e577e57"
  - bureau14/qdb-test-report#master:
      title: "Test report {slug}"
      job:
        variant: {slug}
        junit_input_path: "test-reports/*.xml"
