agents:
  queue: "{queue}"

retry:
  automatic:
      limit: 3

label: "{name} ({slug})"
key: "build-{slug}"

commands:
  - echo \"+++ Start Services\"
  - bash scripts/tests/setup/start-services.sh
  - echo \"+++ Build\"
  - bash scripts/teamcity/10.build.sh
  - echo \"+++ Test\"
  - bash scripts/teamcity/20.test.sh
  - echo \"+++ Examples\"
  - bash scripts/teamcity/30.examples.sh
  - echo \"+++ Documentation examples\"
  - bash scripts/teamcity/40.documentation-examples.sh

plugins:
  - bureau14/qdb-artifacts#67c0599e1c2ce7537eba8bb87baa2f9c0d447e90:
      download:
        clean: true
        projects:
        - project_id: "quasardb-build"
          step: build
          output-dir: "qdb"
          extract: true
          files:
            - "*-c-api.tar.zst!*"
            - "*-server.tar.zst!*"
            - "*-utils.tar.zst!*"
        # sc-20192 test branch only (step-id proof I8b): qdb-nats-connector's
        # latest successful build at 3.14.x, every step it made there.
        - project_id: "qdb-nats-connector"
          git_ref: "refs/heads/3.14.x"
          latest: true
          output-dir: "sc20192-nats"
          files:
            - "*.tar.zst"
  - bureau14/qdb-test-report#master:
      title: "Test report {slug}"
      job:
        variant: {slug}
        junit_input_path: "test-reports/*.xml"
