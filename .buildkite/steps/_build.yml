agents:
  queue: "{queue}"

retry:
  automatic:
      limit: 3

label: "{name} ({slug})"
key: "build-{slug}"

commands:
  - echo \"+++ Start Services\"
  - bash scripts/tests/setup/start-services.sh
  - echo \"+++ Build\"
  - bash scripts/teamcity/10.build.sh
  - echo \"+++ Test\"
  - bash scripts/teamcity/20.test.sh
  - echo \"+++ Examples\"
  - bash scripts/teamcity/30.examples.sh
  - echo \"+++ Documentation examples\"
  - bash scripts/teamcity/40.documentation-examples.sh

plugins:
  - bureau14/qdb-artifacts#67c0599e1c2ce7537eba8bb87baa2f9c0d447e90:
      download:
        clean: true
        projects:
        - project_id: "quasardb-build"
          # sc-20192 test branch only (step-id proof I8a): quasardb-build's latest
          # successful build of the first proof's branch, else of master.
          latest: true
          git_ref: "refs/heads/sc-20192/snapshot-dependencies"
          step: build
          output-dir: "qdb"
          extract: true
          files:
            - "*-c-api.tar.zst!*"
            - "*-server.tar.zst!*"
            - "*-utils.tar.zst!*"
  - bureau14/qdb-test-report#c21c11e9887792d7c7c374707cde0dd8f28defca:
      title: "Test report {slug}"
      job:
        variant: {slug}
        junit_input_path: "test-reports/*.xml"
